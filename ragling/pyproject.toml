[project]
name = "ragling"
version = "0.1.0"
description = "Stateless toolkit: core types, ports, parsers, retrieval and evals"
readme = "README.md"
authors = [
    { name = "deaxparadox", email = "nitish000000kushwaha@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.14.2",
]

[project.optional-dependencies]
pdf = [
    "pdfplumber>=0.11.10",
]
pdf-pdfium = [
    "pypdfium2>=5.14.0",
]
embed-local = [
    "sentence-transformers>=6.2.0",
    "torch>=2.2",
]

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pdfplumber>=0.11.10",
    "pypdfium2>=5.14.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]  # lets tests import tests.golden
addopts = "-m 'not embed_local'"  # the real-model tests run only on purpose: pytest -m embed_local
markers = ["embed_local: loads the real voyage-4-nano model (needs the embed-local extra and EVOKE_EMBED_REVISION)"]

# CPU-only torch (ADR 0004). Applies when ragling itself is the project; the worker image repeats it.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.mypy]
python_version = "3.13"
files = ["src", "tests"]
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = "pypdfium2"
ignore_missing_imports = true  # pypdfium2 ships no py.typed marker; only this module is exempt

[[tool.mypy.overrides]]
module = "sentence_transformers"
ignore_missing_imports = true  # only imported inside _load_model, and only with the embed-local extra
