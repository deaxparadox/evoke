[project]
name = "ragling"
version = "0.1.0"
description = "Stateless toolkit: core types, ports, parsers, retrieval and evals"
readme = "README.md"
authors = [
    { name = "deaxparadox", email = "nitish000000kushwaha@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.14.2",
]

[project.optional-dependencies]
pdf = [
    "pdfplumber>=0.11.10",
]
pdf-pdfium = [
    "pypdfium2>=5.14.0",
]

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pdfplumber>=0.11.10",
    "pypdfium2>=5.14.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]  # lets tests import tests.golden

[tool.mypy]
python_version = "3.13"
files = ["src", "tests"]
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = "pypdfium2"
ignore_missing_imports = true  # pypdfium2 ships no py.typed marker; only this module is exempt
