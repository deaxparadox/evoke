[project]
name = "backend"
version = "0.1.0"
description = "Django backend: API, admin, Celery tasks, pgvector store"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.123",
    "celery[redis]>=5.6.3",
    "django>=5.2.8,<5.3",
    "djangorestframework>=3.18.3",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "ragling",
    "whitenoise>=6.12.0",
]

[project.optional-dependencies]
# Only the worker image installs this (ADR 0004): the parsers, the local embedding model and CPU-only torch.
worker = [
    "ragling[pdf,pdf-pdfium,embed-local]",
]

[dependency-groups]
dev = [
    "ragling[pdf,pdf-pdfium]",
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "pytest-playwright>=0.10.0",
    "ruff>=0.17.3",
]
prod = [
    "gunicorn>=26.2.0",
]

[tool.uv.sources]
ragling = { path = "../ragling", editable = true }
torch = { index = "pytorch-cpu" }  # CPU-only wheels (ADR 0004); the same setting ragling has for itself

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
addopts = "-m 'not integration'"  # integration tests need the running stack: pytest -m integration
markers = ["integration: talks to the real Compose services (SeaweedFS)"]
testpaths = ["tests"]  # e2e/ needs the running stack: run it on purpose with `pytest e2e`

[tool.ruff]
extend-exclude = ["**/migrations/*"]  # generated by Django

[tool.ruff.lint.per-file-ignores]
"**/models.py" = ["RUF012"]  # Django reads Meta.constraints/indexes as plain lists; ruff wants ClassVar
"**/serializers.py" = ["RUF012"]  # same for DRF Meta.fields
