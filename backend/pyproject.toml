[project]
name = "backend"
version = "0.1.0"
description = "Django backend: API, admin, Celery tasks, pgvector store"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=5.2.8,<5.3",
    "psycopg[binary]>=3.3.6",
    "ragling",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "pytest-playwright>=0.10.0",
    "ruff>=0.17.3",
]
prod = [
    "gunicorn>=26.2.0",
]

[tool.uv.sources]
ragling = { path = "../ragling", editable = true }

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]  # e2e/ needs the running stack: run it on purpose with `pytest e2e`

[tool.ruff]
extend-exclude = ["**/migrations/*"]  # generated by Django
